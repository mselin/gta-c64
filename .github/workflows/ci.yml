name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate HTML
        run: git ls-files -z '*.html' | xargs -0 npx --yes html-validate@11.21.1

  # Its own job, on a runner where no npm package has run: html-validate's dependencies are resolved when it
  # runs, and code from them must not share a runner with the PRIVATE_TERMS secret.
  repo:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links, data files and private details
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: python3 .github/scripts/check_repo.py

  game:
    name: Sleazeburg 64 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The browser tests include the page talking to the real presence bridge.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/presence-bridge/go.mod
          cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:unit
      - name: Build the presence bridge for the browser tests
        run: go -C tools/presence-bridge build -o "$RUNNER_TEMP/sleazeburg-presence" .
      - run: npm run test:e2e
        env:
          SLEAZEBURG_BRIDGE: ${{ runner.temp }}/sleazeburg-presence

  # The same browser tests in the other two engines: Firefox, and WebKit, the engine of Safari and of every browser
  # on an iPhone. Both run on macOS: it is the nearest CI has to Safari, and it has a sound device, which the radio
  # tests need (on a Linux runner Firefox's audio never starts). Without the bridge built, its four tests skip;
  # the game job runs them in Chromium.
  engines:
    name: Browser tests in ${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: firefox
            os: macos-latest
          - engine: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:e2e
        env:
          SLEAZEBURG_BROWSER: ${{ matrix.engine }}

  bridge:
    name: Presence bridge on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/presence-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tools/presence-bridge/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt"; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      # Every system builds the same release binaries; bridge-reproducible checks they come out identical.
      - name: Build the release binaries
        run: |
          ./build.sh 0.0.0 linux amd64
          ./build.sh 0.0.0 windows amd64
          (cd dist && for f in sleazeburg-presence-*; do echo "$(sha256sum "$f" 2>/dev/null || shasum -a 256 "$f")"; done) \
            | awk '{ sub(/^\*/, "", $2); print $1, $2 }' > "$RUNNER_TEMP/sums.txt"
          cat "$RUNNER_TEMP/sums.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-sums-${{ matrix.os }}
          path: ${{ runner.temp }}/sums.txt
          retention-days: 3

  bridge-reproducible:
    name: Presence bridge builds are reproducible
    needs: [bridge]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bridge-sums-*
          path: sums
      - name: Compare the binaries built on each system
        run: |
          head -n 50 sums/*/sums.txt
          first=$(ls sums/*/sums.txt | head -n 1)
          for f in sums/*/sums.txt; do
            diff -u "$first" "$f" || { echo "::error::$f differs from $first"; exit 1; }
          done

  homebrew:
    name: Homebrew formula on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the formula from this commit and run its test
        run: |
          git archive --format=tar.gz --prefix=source/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
          brew tap-new --no-git local/ci
          tools/presence-bridge/packaging/homebrew/render.sh 0.0.0 \
            "file://$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/source.tar.gz" \
            > "$(brew --repository)/Library/Taps/local/homebrew-ci/Formula/sleazeburg-presence.rb"
          brew install --build-from-source local/ci/sleazeburg-presence
          brew test local/ci/sleazeburg-presence
          sleazeburg-presence -version

  desktop:
    name: Desktop app on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is pinned: the ubuntu-latest image (Ubuntu 26.04 since November 2026) offers no Ubuntu packages
        # to apt, so the web view's libraries cannot be installed there.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Libraries the web view needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev xvfb
      # The Rust release is pinned in rust-toolchain.toml; rustup fetches it on first use.
      - name: Stage the game for the app
        run: node ../stage.mjs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build the app
        run: cargo build --locked
      # The whole path: the game loads in WebKitGTK, the page calls the app, and the app reaches a stand-in
      # for Discord.
      - name: Smoke test in the real web view
        if: runner.os == 'Linux'
        working-directory: desktop
        run: xvfb-run -a node smoke.cjs src-tauri/target/debug/sleazeburg-64

  # The one check that branch protection requires, so jobs can be added or renamed
  # above without touching the repository settings.
  ok:
    name: All checks passed
    if: always()
    needs: [site, repo, game, engines, bridge, bridge-reproducible, homebrew, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # After every check passes on main: publish the game with GitHub Pages, at https://mselin.github.io/gta-c64/.
  # Only the files the game loads are published, the same ones the desktop app packages (desktop/stage.mjs);
  # the tests, tools and sources stay in the repository. (The repository's Pages source has to be "GitHub
  # Actions".)
  pages:
    name: Publish the game
    # On every push to main, and when started by hand on main (Actions, CI, Run workflow), for example right after
    # the Pages source has been switched to GitHub Actions.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      # (whichever try deployed it)
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Put the game together
        run: node desktop/stage.mjs "$RUNNER_TEMP/site"
      # Named after the run's attempt, so that re-running this job (as the deploy step asks when GitHub Pages fails)
      # deploys its own upload: a run keeps the uploads of every attempt, and two of the same name stop the deploy
      # ("Multiple artifacts named github-pages were unexpectedly found").
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site
          name: github-pages-${{ github.run_attempt }}
      # GitHub's deploy step sometimes cannot find the page it was handed a moment before ("No artifacts named
      # github-pages were found"), though the upload just above succeeded: the list of the run's artifacts lags
      # behind. A look a little later finds it. So the deploy gets three tries, with a wait before the second
      # and the third, and the job fails only if the last one does. A try that fails this way has not started
      # a deployment, so the next one starts clean.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait before the last try
        if: steps.deploy_again.outcome == 'failure'
        run: sleep 90
      - id: deploy_last
        if: steps.deploy_again.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
